<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Landing Page</title>

  <!-- Internal CSS -->
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8f9fa;
    }

    /* Header styles */
    header {
      background-color: #007bff;
      color: white;
      padding: 20px 0;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    header h1 {
      margin: 0;
    }

    header p {
      font-size: 18px;
      margin-top: 10px;
    }

    /* Navigation bar styles */
    nav {
      display: flex;
      justify-content: center;
      background-color: #343a40;
      padding: 10px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-size: 16px;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #007bff;
    }

    /* Main content styles */
    .main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      text-align: center;
    }

    .main-content h2 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    .button {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 30px;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }

    .button:hover {
      background-color: #218838;
    }

    /* Footer styles */
    footer {
      background-color: #343a40;
      color: white;
      text-align: center;
      padding: 20px 0;
      position: fixed;
      bottom: 0;
      width: 100%;
    }

    footer a {
      color: #007bff;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    .message {
      margin-top: 20px;
      font-size: 20px;
      color: #333;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <h1>Welcome to Our Advanced Landing Page</h1>
    <p>Your journey to a bright future begins right here!</p>
  </header>

  <!-- Navigation Bar -->
  <nav>
    <a href="#home">Home</a>
    <a href="#features">Features</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>

  <!-- Main Content -->
  <div class="main-content" id="home">
    <h2>Explore Our Awesome Features</h2>
    <p>We provide innovative solutions to take your experience to the next level!</p>
    <button class="button" onclick="showMessage()">Learn More</button>

    <!-- Message Section -->
    <div class="message" id="message"></div>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Your Company | <a href="#contact">Contact Us</a></p>
  </footer>

  <!-- Internal JavaScript -->
  <script>
    function showMessage() {
      const messageDiv = document.getElementById('message');
      messageDiv.textContent = 'Thanks for your interest! Stay tuned for more updates.';
    }

    // Smooth scroll for navigation
    const links = document.querySelectorAll('nav a');
    links.forEach(link => {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        const targetId = this.getAttribute('href').substring(1);
        const targetElement = document.getElementById(targetId);
        window.scrollTo({
          top: targetElement.offsetTop - 50,
          behavior: 'smooth'
        });
      });
    });
  </script>

</body>
</html>
